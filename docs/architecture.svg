<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="660" viewBox="0 0 1060 660" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect width="1060" height="660" fill="#f8fafc"/>
  <text x="530" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#0f172a">Архитектура AI-детектора экзопланет ExoVision</text>

  <!-- ===== Колонка 1: Источники ===== -->
  <text x="130" y="72" text-anchor="middle" font-size="13" font-weight="700" fill="#64748b">ИСТОЧНИКИ ДАННЫХ</text>

  <rect x="30" y="86" width="200" height="86" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="130" y="108" text-anchor="middle" font-size="13" font-weight="700" fill="#075985">NASA Exoplanet Archive</text>
  <text x="130" y="126" text-anchor="middle" font-size="11.5" fill="#0c4a6e">KOI cumulative — 9 564</text>
  <text x="130" y="141" text-anchor="middle" font-size="11.5" fill="#0c4a6e">размеченных кандидата</text>
  <text x="130" y="156" text-anchor="middle" font-size="11.5" fill="#0c4a6e">(TAP, SQL-запросы)</text>

  <rect x="30" y="190" width="200" height="70" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="130" y="212" text-anchor="middle" font-size="13" font-weight="700" fill="#075985">Каталог TOI (TESS)</text>
  <text x="130" y="230" text-anchor="middle" font-size="11.5" fill="#0c4a6e">~8 000 живых кандидатов,</text>
  <text x="130" y="245" text-anchor="middle" font-size="11.5" fill="#0c4a6e">5 363 без вердикта (PC/APC)</text>

  <rect x="30" y="278" width="200" height="100" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="130" y="300" text-anchor="middle" font-size="13" font-weight="700" fill="#5b21b6">Архив MAST</text>
  <text x="130" y="318" text-anchor="middle" font-size="11.5" fill="#4c1d95">кривые блеска Kepler</text>
  <text x="130" y="333" text-anchor="middle" font-size="11.5" fill="#4c1d95">(lightkurve, long cadence):</text>
  <text x="130" y="348" text-anchor="middle" font-size="11.5" fill="#4c1d95">10 474 примера с 3 095 звёзд</text>
  <text x="130" y="363" text-anchor="middle" font-size="11.5" fill="#4c1d95">(9 467 после фильтра SNR≥7.5)</text>

  <!-- ===== Колонка 2: Предобработка ===== -->
  <text x="392" y="72" text-anchor="middle" font-size="13" font-weight="700" fill="#64748b">ПРЕДОБРАБОТКА</text>

  <rect x="292" y="86" width="200" height="128" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.4"/>
  <text x="392" y="108" text-anchor="middle" font-size="12.5" font-weight="700" fill="#334155">Табличный поток</text>
  <text x="392" y="127" text-anchor="middle" font-size="11" fill="#475569">полная модель: 23 признака,</text>
  <text x="392" y="142" text-anchor="middle" font-size="11" fill="#475569">переносимая (TESS): 12 признаков</text>
  <text x="392" y="157" text-anchor="middle" font-size="11" fill="#475569">(период, глубина, радиус, SNR,</text>
  <text x="392" y="172" text-anchor="middle" font-size="11" fill="#475569">центроиды, MES/SES, звезда…)</text>
  <text x="392" y="191" text-anchor="middle" font-size="11" font-weight="600" fill="#b91c1c">булевы флаги вэттинга исключены</text>
  <text x="392" y="206" text-anchor="middle" font-size="11" fill="#475569">(защита от утечки разметки)</text>

  <rect x="292" y="232" width="200" height="186" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.4"/>
  <text x="392" y="254" text-anchor="middle" font-size="12.5" font-weight="700" fill="#334155">Поток кривых блеска</text>
  <text x="392" y="274" text-anchor="middle" font-size="11" fill="#475569">чистка NaN → выбросы 6σ →</text>
  <text x="392" y="289" text-anchor="middle" font-size="11" fill="#475569">нормировка → детрендинг</text>
  <text x="392" y="304" text-anchor="middle" font-size="11" fill="#475569">(Савицкий–Голей, окно ~0.75 сут)</text>
  <text x="392" y="326" text-anchor="middle" font-size="11" font-weight="600" fill="#334155">фолдинг по периоду ↓</text>
  <text x="392" y="344" text-anchor="middle" font-size="11" fill="#475569">глобальный вид: 128 бинов,</text>
  <text x="392" y="359" text-anchor="middle" font-size="11" fill="#475569">транзит центрируется</text>
  <text x="392" y="377" text-anchor="middle" font-size="11" fill="#475569">локальный вид: ±2.5 длительности,</text>
  <text x="392" y="392" text-anchor="middle" font-size="11" fill="#475569">64 бина + 4 скаляра (как AstroNet)</text>

  <!-- ===== Колонка 3: Модели ===== -->
  <text x="662" y="72" text-anchor="middle" font-size="13" font-weight="700" fill="#64748b">МОДЕЛИ И АЛГОРИТМЫ</text>

  <rect x="554" y="86" width="216" height="118" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/>
  <text x="662" y="107" text-anchor="middle" font-size="12.5" font-weight="700" fill="#14532d">Модель 1 · градиентный бустинг</text>
  <text x="662" y="124" text-anchor="middle" font-size="11" fill="#166534">HistGradientBoosting (scikit-learn)</text>
  <text x="662" y="139" text-anchor="middle" font-size="11" fill="#166534">loss: log-loss · early stopping</text>
  <text x="662" y="157" text-anchor="middle" font-size="11" font-weight="600" fill="#14532d">P(планета): полная 23 призн.</text>
  <text x="662" y="174" text-anchor="middle" font-size="11" fill="#166534">ROC-AUC 0.994 · F1 0.970 (1 518 KOI)</text>
  <text x="662" y="190" text-anchor="middle" font-size="11" fill="#166534">переносимая lite (TESS): AUC 0.982</text>

  <rect x="554" y="222" width="216" height="120" rx="10" fill="#fce7f3" stroke="#db2777" stroke-width="1.6"/>
  <text x="662" y="243" text-anchor="middle" font-size="12.5" font-weight="700" fill="#831843">Модель 2 · двухветочная 1D-CNN</text>
  <text x="662" y="260" text-anchor="middle" font-size="11" fill="#9d174d">global 128→Conv×3→512 ┐</text>
  <text x="662" y="275" text-anchor="middle" font-size="11" fill="#9d174d">local 64→Conv×2→256  ┼→ FC128→64→3</text>
  <text x="662" y="290" text-anchor="middle" font-size="11" fill="#9d174d">+4 скаляра ───────────┘ (softmax)</text>
  <text x="662" y="307" text-anchor="middle" font-size="11" fill="#9d174d">PyTorch→ONNX · 117 955 параметров</text>
  <text x="662" y="323" text-anchor="middle" font-size="11" fill="#9d174d">обучение: 24k синтетики + 9 467</text>
  <text x="662" y="337" text-anchor="middle" font-size="11" font-weight="600" fill="#831843">реальных кривых Kepler · acc 0.862</text>

  <rect x="554" y="360" width="216" height="80" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/>
  <text x="662" y="381" text-anchor="middle" font-size="12.5" font-weight="700" fill="#78350f">BLS · поиск периода</text>
  <text x="662" y="399" text-anchor="middle" font-size="11" fill="#92400e">Box Least Squares (astropy)</text>
  <text x="662" y="414" text-anchor="middle" font-size="11" fill="#92400e">12 000 периодов + уточнение ±1%</text>
  <text x="662" y="429" text-anchor="middle" font-size="11" fill="#92400e">классика, не ML — находит сигнал</text>

  <rect x="554" y="458" width="216" height="86" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.4"/>
  <text x="662" y="479" text-anchor="middle" font-size="12.5" font-weight="700" fill="#334155">Классические проверки</text>
  <text x="662" y="497" text-anchor="middle" font-size="11" fill="#475569">U-форма дна vs V-форма двойной</text>
  <text x="662" y="512" text-anchor="middle" font-size="11" fill="#475569">вторичное затмение · чёт/нечёт · SNR</text>
  <text x="662" y="527" text-anchor="middle" font-size="11" fill="#475569">(как у вэттеров NASA)</text>

  <!-- ===== Колонка 4: Выход ===== -->
  <text x="932" y="72" text-anchor="middle" font-size="13" font-weight="700" fill="#64748b">РЕЗУЛЬТАТ</text>

  <rect x="832" y="106" width="200" height="96" rx="10" fill="#cffafe" stroke="#0891b2" stroke-width="1.6"/>
  <text x="932" y="128" text-anchor="middle" font-size="12.5" font-weight="700" fill="#155e75">Рейтинг кандидатов TESS</text>
  <text x="932" y="147" text-anchor="middle" font-size="11" fill="#164e63">5 363 непроверенных TOI,</text>
  <text x="932" y="162" text-anchor="middle" font-size="11" fill="#164e63">ранжированных P(планета)</text>
  <text x="932" y="177" text-anchor="middle" font-size="11" fill="#164e63">lite-моделью, ссылки на ExoFOP</text>

  <rect x="832" y="236" width="200" height="110" rx="10" fill="#cffafe" stroke="#0891b2" stroke-width="1.6"/>
  <text x="932" y="258" text-anchor="middle" font-size="12.5" font-weight="700" fill="#155e75">Вердикт по кривой</text>
  <text x="932" y="277" text-anchor="middle" font-size="11" fill="#164e63">период (BLS) + сложенная кривая</text>
  <text x="932" y="292" text-anchor="middle" font-size="11" fill="#164e63">+ вероятности нейросети</text>
  <text x="932" y="307" text-anchor="middle" font-size="11" fill="#164e63">+ проверки вэттинга</text>
  <text x="932" y="326" text-anchor="middle" font-size="11" font-weight="600" fill="#155e75">пример: Kepler-10 b найден</text>
  <text x="932" y="341" text-anchor="middle" font-size="11" font-weight="600" fill="#155e75">без подсказки периода</text>

  <rect x="832" y="380" width="200" height="76" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.4"/>
  <text x="932" y="402" text-anchor="middle" font-size="12.5" font-weight="700" fill="#334155">Веб-интерфейс</text>
  <text x="932" y="420" text-anchor="middle" font-size="11" fill="#475569">страница «AI-детектор»:</text>
  <text x="932" y="435" text-anchor="middle" font-size="11" fill="#475569">графики, объяснения, ExoFOP</text>

  <!-- ===== Стрелки ===== -->
  <line x1="230" y1="129" x2="292" y2="140" stroke="#475569" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="230" y1="225" x2="292" y2="160" stroke="#475569" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="230" y1="325" x2="292" y2="320" stroke="#475569" stroke-width="1.6" marker-end="url(#arr)"/>

  <line x1="492" y1="150" x2="554" y2="142" stroke="#475569" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="492" y1="300" x2="554" y2="280" stroke="#475569" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="492" y1="370" x2="554" y2="398" stroke="#475569" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="492" y1="390" x2="554" y2="498" stroke="#475569" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- BLS находит период и возвращает его в фолдинг -->
  <path d="M 554 414 C 500 432, 470 432, 448 416" stroke="#d97706" stroke-width="1.5" fill="none" stroke-dasharray="5 4" marker-end="url(#arr)"/>
  <text x="500" y="449" text-anchor="middle" font-size="10.5" fill="#92400e">найденный период → фолдинг</text>

  <line x1="770" y1="145" x2="832" y2="150" stroke="#475569" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="770" y1="282" x2="832" y2="285" stroke="#475569" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="770" y1="400" x2="832" y2="300" stroke="#475569" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="770" y1="500" x2="832" y2="320" stroke="#475569" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="932" y1="202" x2="932" y2="236" stroke="#475569" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="932" y1="346" x2="932" y2="380" stroke="#475569" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- подпись -->
  <text x="530" y="636" text-anchor="middle" font-size="11" fill="#94a3b8">Обучение CNN — на GPU (RTX 3070); инференс — локально на CPU (ONNX) · scikit-learn + PyTorch + astropy + lightkurve · метрики: backend/models/</text>
</svg>
