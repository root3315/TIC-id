<!doctype html>
<!--
  Превью ссылки (Open Graph) для exovision.mydevbox.xyz, 1200×630.
  Справа — настоящая TRAPPIST-1 сверху: орбиты и зона обитаемости в масштабе
  (pscomppars + Kopparapu), звезда тоже в масштабе — поэтому она крошечная.

  Пересобрать картинку (из корня репо):
    chrome --headless=new --hide-scrollbars --window-size=1200,630 \
      --virtual-time-budget=4000 --screenshot=frontend/public/og.png design/og.html
-->
<html lang="ru">
<head>
<meta charset="utf-8" />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600&family=IBM+Plex+Mono:wght@400;500&display=block" rel="stylesheet" />
<style>
  :root {
    --void: #05081a; --ink: #e8ecff; --ink-2: #a7b1d4; --ink-3: #79849f; --ink-4: #5a6482;
    --beam: #22d3ee; --data-indigo: #818cf8; --habitable: 74, 222, 128; --rule: rgba(148, 163, 253, 0.16);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; background: var(--void); }
  body { position: relative; font-family: 'IBM Plex Sans', sans-serif; color: var(--ink); }
  #sky { position: absolute; inset: 0; }
  .text { position: absolute; left: 72px; top: 0; bottom: 0; width: 560px;
          display: flex; flex-direction: column; justify-content: center; }
  .mark { font-size: 108px; font-weight: 600; letter-spacing: -0.045em; line-height: 0.95; }
  .mark span { color: var(--beam); }
  .line { margin-top: 28px; font-size: 34px; line-height: 1.3; color: var(--ink-2); letter-spacing: -0.01em; }
  .facts { margin-top: 30px; font-family: 'IBM Plex Mono', monospace; font-size: 22px; color: var(--ink-3); }
  .domain { position: absolute; left: 72px; bottom: 48px; font-family: 'IBM Plex Mono', monospace;
            font-size: 20px; color: var(--ink-4); }
  .caption { position: absolute; right: 64px; top: 44px; font-family: 'IBM Plex Mono', monospace;
             font-size: 18px; color: var(--ink-4); text-align: right; }
  svg { position: absolute; left: 640px; top: 35px; }
  .pl { font-family: 'IBM Plex Mono', monospace; font-size: 17px; font-weight: 500; fill: var(--ink-3); }
</style>
</head>
<body>
<canvas id="sky" width="1200" height="630"></canvas>

<div class="text">
  <div class="mark"><span>Exo</span>Vision</div>
  <div class="line">Экзопланеты по данным NASA — звёзды и орбиты в настоящем масштабе</div>
  <div class="facts">6 400+ планет · 4 800+ звёзд</div>
</div>
<div class="domain">exovision.mydevbox.xyz</div>
<div class="caption">TRAPPIST-1 · 7 планет<br />орбиты и звезда в масштабе</div>

<svg id="sys" width="560" height="560" viewBox="-280 -280 560 560"></svg>

<script>
  // Детерминированное звёздное небо: одинаковая картинка при каждой пересборке
  let seed = 7;
  const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
  const sky = document.getElementById("sky").getContext("2d");
  for (let i = 0; i < 260; i++) {
    const x = rnd() * 1200, y = rnd() * 630, r = rnd() < 0.92 ? 0.7 : 1.3;
    sky.fillStyle = `rgba(214, 222, 255, ${0.12 + rnd() * 0.4})`;
    sky.beginPath(); sky.arc(x, y, r, 0, Math.PI * 2); sky.fill();
  }

  // TRAPPIST-1: большие полуоси (а.е.) из pscomppars, зона обитаемости по Коппарапу
  const AU = 4000;                                   // пикселей на а.е.
  const planets = [["b", 0.01154], ["c", 0.0158], ["d", 0.02227], ["e", 0.02925],
                   ["f", 0.03849], ["g", 0.04683], ["h", 0.06189]];
  const hz = { io: 0.0193, ic: 0.0254, oc: 0.0499, oo: 0.0534 };
  const starR = 0.1192 * 0.00465047 * AU;            // 0,12 R☉ → ~2 px: честно крошечная
  const svg = document.getElementById("sys");
  const ns = "http://www.w3.org/2000/svg";
  const el = (tag, attrs) => { const e = document.createElementNS(ns, tag);
    Object.entries(attrs).forEach(([k, v]) => e.setAttribute(k, v)); svg.appendChild(e); return e; };
  const ring = (a, b, alpha) => el("path", {
    d: `M ${b * AU} 0 A ${b * AU} ${b * AU} 0 1 0 ${-b * AU} 0 A ${b * AU} ${b * AU} 0 1 0 ${b * AU} 0 Z
        M ${a * AU} 0 A ${a * AU} ${a * AU} 0 1 1 ${-a * AU} 0 A ${a * AU} ${a * AU} 0 1 1 ${a * AU} 0 Z`,
    fill: `rgba(var(--habitable), ${alpha})`, "fill-rule": "evenodd" });
  ring(hz.io, hz.oo, 0.08);
  ring(hz.ic, hz.oc, 0.12);
  planets.forEach(([, a]) => el("circle", { r: a * AU, fill: "none", stroke: "var(--rule)", "stroke-width": 1.2 }));
  const glow = el("radialGradient", { id: "g" });
  [["0", "#ff8f5e", 1], ["0.35", "#ff8f5e", 0.55], ["1", "#ff8f5e", 0]].forEach(([o, c, op]) => {
    const s = document.createElementNS(ns, "stop");
    s.setAttribute("offset", o); s.setAttribute("stop-color", c); s.setAttribute("stop-opacity", op); glow.appendChild(s);
  });
  el("circle", { r: 16, fill: "url(#g)" });
  el("circle", { r: Math.max(starR, 2.2), fill: "#ffb08a" });
  planets.forEach(([name, a], i) => {
    const ang = -0.9 + i * 2.39996;
    const x = Math.cos(ang) * a * AU, y = Math.sin(ang) * a * AU;
    const inZone = a >= hz.io && a <= hz.oo;
    el("circle", { cx: x, cy: y, r: 6, fill: "var(--data-indigo)",
                   stroke: inZone ? "rgb(var(--habitable))" : "none", "stroke-width": 2 });
    el("text", { x: x + 11, y: y - 9, class: "pl" }).textContent = name;
  });
</script>
</body>
</html>
